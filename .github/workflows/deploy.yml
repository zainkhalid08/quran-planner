name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Append Cache-Busting Query Params
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            // Use the first 8 characters of the commit SHA, or timestamp as fallback
            const version = process.env.GITHUB_SHA ? process.env.GITHUB_SHA.slice(0, 8) : Date.now().toString(36);
            console.log("Applying cache-busting version:", version);

            // 1. Cache-bust scripts and stylesheets referenced in index.html
            if (fs.existsSync("index.html")) {
              let html = fs.readFileSync("index.html", "utf8");
              html = html.replace(/(<script\s+[^>]*src=["\x27])(js\/[^"\x27\s?]+)(?:\?[^"\x27]*)?(["\x27][^>]*>)/gi, `$1$2?v=${version}$3`);
              html = html.replace(/(<link\s+[^>]*href=["\x27])(css\/[^"\x27\s?]+)(?:\?[^"\x27]*)?(["\x27][^>]*>)/gi, `$1$2?v=${version}$3`);
              fs.writeFileSync("index.html", html, "utf8");
              console.log("Updated index.html asset references with ?v=" + version);
            }

            // 2. Cache-bust all relative ES module imports across all JS files
            function updateJsImports(dir) {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  updateJsImports(fullPath);
                } else if (entry.isFile() && entry.name.endsWith(".js")) {
                  let content = fs.readFileSync(fullPath, "utf8");
                  const updated = content.replace(
                    /(from\s+["\x27])(\.{1,2}\/[^"\x27\s?]+?\.js)(?:\?[^"\x27]*)?(["\x27])/g,
                    `$1$2?v=${version}$3`
                  );
                  if (updated !== content) {
                    fs.writeFileSync(fullPath, updated, "utf8");
                  }
                }
              }
            }

            if (fs.existsSync("js")) {
              updateJsImports("js");
              console.log("Updated all internal JS module imports with ?v=" + version);
            }
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

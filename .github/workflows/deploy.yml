name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Append Cache-Busting Query Params
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");

            function getFileHash(filePath) {
              if (!fs.existsSync(filePath)) return null;
              const content = fs.readFileSync(filePath);
              return crypto.createHash("md5").update(content).digest("hex").slice(0, 8);
            }


            // 2. Cache-bust scripts in index.html based on individual file content
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(/(<script\s+[^>]*src=["\x27])(js\/[^"\x27]+)(["\x27][^>]*>)/gi, (m, p, s, suf) => {
              const cleanSrc = s.split("?")[0];
              const hash = getFileHash(cleanSrc);
              return hash ? `${p}${cleanSrc}?v=${hash}${suf}` : m;
            });

            // 3. Cache-bust stylesheets in index.html based on css file content (including updated styles.css)
            html = html.replace(/(<link\s+[^>]*href=["\x27])(css\/[^"\x27]+)(["\x27][^>]*>)/gi, (m, p, s, suf) => {
              const cleanHref = s.split("?")[0];
              const hash = getFileHash(cleanHref);
              return hash ? `${p}${cleanHref}?v=${hash}${suf}` : m;
            });

            fs.writeFileSync("index.html", html, "utf8");
            console.log("Appended content-based hashes to all scripts and stylesheets in index.html");
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

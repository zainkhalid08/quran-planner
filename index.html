<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quran Planner — Day-by-Day Reading Schedule</title>
  <meta name="description"
    content="Create a personalized Quran reading schedule. Set your daily goal and get a day-by-day plan to complete the Quran in 30 days, 60 days, Ramadan, or any timeframe. Free online tool." />
  <meta name="keywords"
    content="quran planner, quran reading schedule, complete quran, daily quran reading, ramadan quran plan, islamic reading plan, quran in 30 days" />
  <meta name="author" content="Quran Planner" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://quranplanner.org" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Quran Planner — Day-by-Day Reading Schedule" />
  <meta property="og:description"
    content="Create a personalized Quran reading schedule. Set your daily goal and get a day-by-day plan to complete the Quran in 30 days, 60 days, Ramadan, or any timeframe." />
  <meta property="og:url" content="https://quranplanner.org" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="Quran Planner" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Quran Planner — Day-by-Day Reading Schedule" />
  <meta name="twitter:description"
    content="Create a personalized Quran reading schedule. Set your daily goal and get a day-by-day plan to complete the Quran in 30 days, 60 days, Ramadan, or any timeframe." />
  <meta property="og:image" content="https://quranplanner.com/screenshots/home-page.png" />
  <meta name="twitter:image" content="https://quranplanner.com/screenshots/home-page.png" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Quran Planner",
    "description": "Create a personalized day-by-day Quran reading schedule. Set your goal and get a plan to complete the Quran in 30 days, 60 days, Ramadan, or any timeframe.",
    "url": "https://quranplanner.org",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    }
  }
  </script>

  <!-- Immediate theme initialization before render to prevent FOUC -->
  <script>
    (function () {
      try {
        var preference = localStorage.getItem('quran_planner_theme_preference') || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (preference === 'dark' || (preference === 'system' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=1.8" />
</head>

<body>

  <!-- Theme selector (Light / System / Dark) -->
  <div class="top-bar">
    <div class="theme-switch" role="group" aria-label="Theme mode">
      <button type="button" class="theme-btn" data-theme="light" title="Light mode" aria-label="Light mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41">
          </path>
        </svg>
      </button>
      <button type="button" class="theme-btn" data-theme="system" title="System default" aria-label="System default">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="14" x="2" y="3" rx="2"></rect>
          <line x1="8" x2="16" y1="21" y2="21"></line>
          <line x1="12" x2="12" y1="17" y2="21"></line>
        </svg>
      </button>
      <button type="button" class="theme-btn" data-theme="dark" title="Dark mode" aria-label="Dark mode">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
        </svg>
      </button>
    </div>
  </div>

  <header role="banner">
    <!-- <div class="header-icon" aria-hidden="true">🌙</div> -->
    <h1>Quran Planner</h1>
    <p>Set a target — get a plan day-by-day</p>
  </header>

  <!-- Form card -->
  <div class="card" id="plannerFormCard">

    <div class="field">
      <div class="field-label">
        <label for="days">Complete in</label>
        <span class="field-hint" id="daysHint">how many days?</span>
      </div>
      <input type="number" id="days" min="1" max="6236" placeholder="e.g. 30" aria-describedby="daysHint" />
      <div class="pill-row" id="daysPills">
        <button type="button" class="pill" data-days="15">15 Days</button>
        <button type="button" class="pill" data-days="30">1 Month</button>
        <button type="button" class="pill" data-days="90">3 Months</button>
        <button type="button" class="pill" data-days="120">4 Months</button>
        <button type="button" class="pill" data-days="180">6 Months</button>
        <button type="button" class="pill" data-days="365">1 Year</button>
        <span class="pill-date-wrap">
          <label for="pickDateInput" class="sr-only">Pick a target completion date</label>
          <button type="button" class="pill" id="pickDatePill" tabindex="-1" aria-hidden="true">Pick a date</button>
          <input type="date" id="pickDateInput" class="pill-date-input" aria-label="Pick a target completion date" />
        </span>
        <button type="button" class="pill" id="ramadanPill">Before Ramadan</button>
        <button type="button" class="pill" id="endRamadanPill">End Ramadan</button>
      </div>
      <div class="pill-note" id="ramadanNote"></div>
    </div>

    <div class="field">
      <div class="field-label">
        <label for="startSurah" id="startSurahLabel">Starting from</label>
        <span class="field-hint" id="startHint">leave blank to start from the beginning</span>
      </div>
      <div class="input-row">
        <select id="startSurah" aria-labelledby="startSurahLabel" aria-describedby="startHint"></select>
        <label for="startAyah" class="sr-only">Starting Ayah</label>
        <input type="number" id="startAyah" min="1" placeholder="Ayah" aria-label="Starting Ayah" />
      </div>
    </div>

    <button class="btn" id="generatePlanBtn">Generate my plan →</button>

    <!-- Actions -->
    <div class="results-actions" id="resultsActions" style="display: none;">
      <button class="btn-download" id="printBtn" title="Print or save as a multi-page vector PDF document" aria-label="Print or save as PDF">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4.5 4.5V1.5H10.5V4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2.5 5.5H12.5C13.05 5.5 13.5 5.95 13.5 6.5V10.5H1.5V6.5C1.5 5.95 1.95 5.5 2.5 5.5Z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 9.5H11V13.5H4V9.5Z" fill="var(--card, #fff)" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5.5 11.5H9.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
        Get PDF
      </button>
      <button class="btn-download" id="downloadBtn" style="display: none;">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M7.5 10.5L3.5 6.5H6V1.5H9V6.5H11.5L7.5 10.5Z" fill="currentColor" />
          <path d="M2 12.5H13V13.5H2V12.5Z" fill="currentColor" />
        </svg>
        Download Image
      </button>
      <button class="btn-download" id="clearPlanBtn" title="Clear this plan and create a new one" aria-label="Reset plan and clear inputs">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path
            d="M1.5 7.5C1.5 4.18629 4.18629 1.5 7.5 1.5C10.1255 1.5 12.3486 3.18635 13.1517 5.5M13.5 7.5C13.5 10.8137 10.8137 13.5 7.5 13.5C4.87449 13.5 2.6514 11.8137 1.8483 9.5M13.5 2V5.5H10M1.5 13V9.5H5"
            stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Reset Plan
      </button>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="card">

    <div class="results-header">
      <div class="results-title">Quran Planner</div>
      <div class="results-subtitle">Reading Schedule day-by-day</div>
    </div>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <div class="stat-val" id="statDays">—</div>
        <div class="stat-lbl">Days</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statAvg">—</div>
        <div class="stat-lbl">Avg Ayahs / Day</div>
      </div>
    </div>

    <!-- Column headers -->
    <div class="plan-header">
      <span>Day</span>
      <span class="header-surah"></span>
      <span>Read till ayah</span>
    </div>

    <!-- Day rows -->
    <div id="planRows"></div>

    <div class="results-footer" id="resultsFooter"></div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
